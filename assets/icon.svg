<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#14151f"/>
    </linearGradient>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb3ff"/>
      <stop offset="1" stop-color="#5677d4"/>
    </linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbb1ff"/>
      <stop offset="1" stop-color="#9573dc"/>
    </linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be3ff"/>
      <stop offset="1" stop-color="#45a9dc"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4"/>

  <g transform="translate(512 548) scale(1.16) translate(-512 -548)">
  <!-- sombra no chao -->
  <ellipse cx="512" cy="842" rx="330" ry="34" fill="#000" opacity="0.38" filter="url(#soft)"/>

  <!-- pedra de baixo -->
  <g transform="rotate(-2 512 712)">
    <ellipse cx="512" cy="712" rx="318" ry="132" fill="url(#s1)"/>
    <ellipse cx="458" cy="668" rx="190" ry="38" fill="#fff" opacity="0.16"/>
  </g>

  <!-- pedra do meio -->
  <g transform="rotate(4 530 520)">
    <ellipse cx="530" cy="520" rx="226" ry="104" fill="url(#s2)"/>
    <ellipse cx="486" cy="486" rx="132" ry="28" fill="#fff" opacity="0.2"/>
  </g>

  <!-- pedra de cima -->
  <g transform="rotate(-6 506 352)">
    <ellipse cx="506" cy="352" rx="136" ry="78" fill="url(#s3)"/>
    <ellipse cx="478" cy="328" rx="76" ry="20" fill="#fff" opacity="0.26"/>
  </g>
  </g>
</svg>
